# Local development services. `pnpm db:up` / `pnpm db:down`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: pulseed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseed
      POSTGRES_PASSWORD: pulseed
      POSTGRES_DB: pulseed
    ports:
      - "5432:5432"
    volumes:
      - pulseed-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseed -d pulseed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulseed-pgdata:
