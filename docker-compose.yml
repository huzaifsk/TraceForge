# Local development services. `pnpm db:up` / `pnpm db:down`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: traceforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge
      POSTGRES_DB: traceforge
    ports:
      - "5432:5432"
    volumes:
      - traceforge-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge -d traceforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  traceforge-pgdata:
