packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# Single source of truth for versions shared across workspaces.
# Reference with `"<dep>": "catalog:"` in a workspace package.json.
catalog:
  "@types/node": ^22.20.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/coverage-v8": ^5.0.1
  eslint: ^9.39.5
  next: 16.3.6
  react: 19.3.0
  react-dom: 19.3.0
  # Recharts peers on react-is; pin one version so the dashboard and packages/ui
  # resolve the same Recharts instance (two instances render empty charts).
  react-is: 19.3.0
  recharts: 3.8.0
  typescript: ~6.0.3
  vitest: ^5.0.1
  zod: ^4.6.5

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - "@next/env@16.3.6"
  - "@next/eslint-plugin-next@16.3.6"
  - "@next/swc-darwin-arm64@16.3.6"
  - "@next/swc-darwin-x64@16.3.6"
  - "@next/swc-linux-arm64-gnu@16.3.6"
  - "@next/swc-linux-arm64-musl@16.3.6"
  - "@next/swc-linux-x64-gnu@16.3.6"
  - "@next/swc-linux-x64-musl@16.3.6"
  - "@next/swc-win32-arm64-msvc@16.3.6"
  - "@next/swc-win32-x64-msvc@16.3.6"
  - "@turbo/darwin-64@2.11.3"
  - "@turbo/darwin-arm64@2.11.3"
  - "@turbo/linux-64@2.11.3"
  - "@turbo/linux-arm64@2.11.3"
  - "@turbo/windows-64@2.11.3"
  - "@turbo/windows-arm64@2.11.3"
  - cn@0.4.0
  - eslint-plugin-turbo@2.11.3
  - next@16.3.6
  - prettier@3.9.9
  - turbo@2.11.3
