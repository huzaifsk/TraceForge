name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceforge
          POSTGRES_PASSWORD: traceforge
          POSTGRES_DB: traceforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceforge -d traceforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://traceforge:traceforge@localhost:5432/traceforge_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm turbo run lint typecheck test build

      - name: SDK bundle size
        run: pnpm --filter @traceforge/sdk size

      - name: Install Playwright Chromium
        run: pnpm --filter @traceforge/e2e exec playwright install --with-deps chromium

      - name: Browser tests (SDK in Chromium)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
